<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Twelve Stars</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* Layout idea: a campaign table. Score strip on top, the real map of the 27 member states
   in the middle, one action panel below that changes with each turn. Single dark theme. */
:root{
  color-scheme: dark;
  --night:#07133d;      /* page */
  --sea:#0a1f6e;        /* water on the map */
  --tile:#3556d1;       /* unclaimed member state */
  --line:#2f4cc4;       /* control borders */
  --ink:#f4f1e4;        /* text */
  --dim:#a9b6e6;        /* secondary text */
  --gold:#ffcc00;       /* player 1 and the accent */
  --coral:#ff7a66;      /* player 2 */
  --mint:#43e0b8;       /* player 3 */
  --good:#7be38c; --bad:#ff8d8d;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--night);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;
  background-image:radial-gradient(120% 60% at 50% 0%, #12277a 0%, var(--night) 70%);background-attachment:fixed}
#app{max-width:520px;margin:0 auto;padding:10px 16px 28px;display:flex;flex-direction:column;gap:10px;min-height:100%}
#top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.02em}
.brand b{color:var(--gold)}
#roomTag{font-size:12px;font-weight:800;color:var(--dim);letter-spacing:.08em}
#leave{background:transparent;border:1.5px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700}

/* scores */
#scores{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
#scores:empty{display:none}
.pl{border:2px solid transparent;border-radius:10px;padding:6px 8px;background:#0c1d5c;display:flex;flex-direction:column;gap:1px;min-width:0}
.pl.on{border-color:var(--c)}
.pl.out{opacity:.4}
.pl .nm{font-weight:800;font-size:13px;display:flex;align-items:center;gap:6px;min-width:0}
.pl .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .nm i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.pl .sc{font-family:var(--display);font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;color:var(--c)}
.pl .tl{font-size:11px;color:var(--dim);line-height:1.25}

/* map */
#boardWrap{background:var(--sea);border-radius:16px;padding:4px;border:1px solid #2743b8;overflow:hidden}
#board{display:block;width:100%;max-height:48vh}
.bg{fill:#1a2c7c;stroke:var(--sea);stroke-width:.6}
.land,.dot{fill:var(--tile);stroke:#c9d4ff;stroke-width:.7;stroke-linejoin:round;transition:fill .35s,opacity .25s}
.o0{fill:var(--gold)} .o1{fill:var(--coral)} .o2{fill:var(--mint)}
.faded{opacity:.38}
.pick{stroke:#fff;stroke-width:2.2;cursor:pointer;animation:pulse 1.1s ease-in-out infinite}
.hot{stroke:#fff;stroke-width:2.8}
.sea{fill:none;stroke:#9fb3ff;stroke-width:1.3;stroke-dasharray:3 4;opacity:.75;pointer-events:none}
.lab text{text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:#07133d;stroke-linejoin:round}
.lab .c{font:700 15px var(--display);fill:#fff;stroke-width:3.5}
.lab .s{font-size:13px;fill:#fff;stroke-width:3;letter-spacing:.5px}
.hit{fill:transparent;cursor:pointer}
@keyframes pulse{50%{stroke-opacity:.2}}

/* panel */
#panel{background:#0c1d5c;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px;border:1px solid #2743b8}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
h1{font-family:var(--display);font-weight:900;font-size:34px;line-height:1;margin:0;letter-spacing:-.02em;text-wrap:balance}
h1 span{color:var(--gold)}
h2{font-family:var(--display);font-weight:700;font-size:17px;line-height:1.3;margin:0;text-wrap:balance}
p{margin:0}
.dim{color:var(--dim)} p.dim,span.dim{opacity:1}
.small{font-size:13px}
ol.how{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;color:var(--dim);font-size:14px}
ol.how b{color:var(--ink)}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:2px}
button:disabled{cursor:default}
.go{background:var(--gold);color:#07133d;font-family:var(--display);font-weight:700;font-size:15px;padding:14px;border-radius:12px;width:100%}
.go:disabled{opacity:.45}
.go:active:not(:disabled){transform:translateY(1px)}
.ghost{border:2px solid var(--line);padding:12px;border-radius:12px;font-weight:800;width:100%}
.choice{display:grid;gap:2px;text-align:left;background:#17308f;border:2px solid var(--line);border-radius:12px;padding:12px 14px;width:100%}
.choice b{font-family:var(--display);font-weight:700;font-size:15px}
.choice span{color:var(--dim);font-size:13px}
.choice:hover{border-color:#6f8cff}
.stack{display:grid;gap:8px}
input[type=text]{width:100%;background:#07133d;border:2px solid var(--line);border-radius:10px;padding:12px;color:var(--ink);font:600 16px var(--body)}
input[type=text]::placeholder{color:#6f7fb8}
label.f{display:grid;gap:4px;font-size:13px;font-weight:700;color:var(--dim)}
.row2{display:flex;gap:8px;align-items:stretch}
.row2>*{flex:1}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg button{background:#17308f;border:2px solid var(--line);border-radius:10px;padding:10px;font-weight:800}
.seg button[aria-pressed="true"]{background:var(--gold);color:#07133d;border-color:var(--gold)}
.note{border-left:3px solid var(--gold);padding:8px 12px;background:#0a1850;border-radius:0 10px 10px 0;font-size:14px;color:var(--dim)}
.note b{color:var(--ink)}
.codebig{font-family:var(--display);font-weight:900;font-size:40px;letter-spacing:.22em;text-align:center;color:var(--gold);background:#07133d;border-radius:12px;padding:10px 0 10px .22em}
ul.lobby{list-style:none;margin:0;padding:0;display:grid;gap:6px}
ul.lobby li{background:#17308f;border-radius:10px;padding:9px 12px;display:flex;justify-content:space-between;gap:8px;font-weight:700}
ul.lobby li span{color:var(--dim);font-weight:600;font-size:13px}
.timer{height:5px;background:#182f85;border-radius:3px;overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:var(--gold)}
.timer.slim{height:3px}
.opts{display:grid;gap:8px}
.opt{background:#17308f;border:2px solid var(--line);border-radius:12px;padding:12px;text-align:left;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:48px}
.opt.sel{border-color:#fff}
.opt.right{background:#145c3a;border-color:var(--good)}
.opt.wrong{background:#5a1f3a;border-color:var(--bad)}
.dots{display:flex;gap:4px;flex:none}
.dots i,.who i{width:12px;height:12px;border-radius:50%;background:var(--c);display:inline-block;border:1.5px solid #07133d;flex:none}
.display{font-family:var(--display);font-weight:700;font-size:28px;text-align:center;background:#07133d;border-radius:12px;padding:10px;min-height:56px;font-variant-numeric:tabular-nums;border:2px solid var(--line)}
.display small{font-family:var(--body);font-size:13px;color:var(--dim);font-weight:600}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pad button{background:#17308f;border-radius:10px;padding:11px 0;font-family:var(--display);font-weight:700;font-size:17px}
.pad button.ok{background:var(--gold);color:#07133d}
.pad button:active{filter:brightness(1.3)}
.word{display:grid;gap:8px}
.rank{display:grid;gap:6px}
.rank .row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:#17308f;border-radius:10px;padding:8px 12px;font-weight:600}
.rank .row.top{outline:2px solid var(--gold)}
.rank .g{font-family:var(--display);font-variant-numeric:tabular-nums;text-align:right}
.rank .typed{overflow-wrap:anywhere}
.mark{font-weight:900}.mark.y{color:var(--good)}.mark.n{color:var(--bad)}
.who{display:inline-flex;align-items:center;gap:6px;font-weight:800}
.nmx{font-weight:800}
.answer{font-family:var(--display);font-weight:700;color:var(--gold)}
.out{font-weight:800}
.out.w{color:var(--good)} .out.l{color:var(--bad)}
.final{display:grid;gap:8px}
.final .row{display:flex;justify-content:space-between;align-items:center;background:#17308f;border-radius:10px;padding:10px 12px;font-weight:800}
.final .row b{font-family:var(--display)}
@media (prefers-reduced-motion:reduce){.pick{animation:none}.land,.dot{transition:none}}
</style>
</head>
<body>
<div id="app">
  <header id="top"><span class="brand">Twelve <b>Stars</b></span><span id="roomTag"></span><button id="leave" hidden>Menu</button></header>
  <div id="scores"></div>
  <div id="boardWrap"><svg id="board" role="img" aria-label="Map of the 27 EU member states"></svg></div>
  <div id="panel"></div>
</div>

function answerSeat(S) {
  const ph = S.ph;

  return ph.parts.includes(me()) ? me() : -1;
}
function qHtml(S) {
  const ph = S.ph, q = BANK[ph.ty][ph.qi], s = answerSeat(S);
  let h = `<h2>${esc(q.q)}</h2><div class="timer"><i id="tbar"></i></div>`;
  if (ph.ty === "m") {

  } else if (s >= 0 && ph.ty === "n") {

  } else if (s >= 0 && ph.ty === "w") {

  }

}
function wireQ(S) {

    document.querySelectorAll("#panel button, #panel input").forEach(b => b.disabled = true);
    const others = ph.ask === undefined ? ph.parts.filter(p => p !== s && S.seats[p].kind !== "bot") : [];
    const wl = $("#waitline"); if (wl && others.length) { wl.hidden = false; wl.innerHTML = `Locked in. Waiting for ${names(others, S)}.`; }
    submit(s, {v, t: Math.round((performance.now() - t0[k]) / 100) / 10});
  };
  let current = () => null;

    const show = () => { $("#disp").innerHTML = v === "" ? "<small>Type your guess</small>" : v + unit; };
    const key = x => { if (done) return; if (x === "OK") { if (v !== "") fin(Number(v)); } else if (x === "⌫") { v = v.slice(0, -1); show(); } else if (v.length < 6) { v = (v === "0" ? "" : v) + x; show(); } };
    const kd = e => { if (/^[0-9]$/.test(e.key)) key(e.key); else if (e.key === "Backspace") key("⌫"); else if (e.key === "Enter") key("OK"); };

  } else {
    const inp = $("#win");

    setTimeout(() => { try { inp.focus({preventScroll: true}); } catch (e) {} }, 60);
    current = () => inp.value.trim() || null;
  }

}
function revHtml(S) {
  const ph = S.ph, q = BANK[ph.ty][ph.qi], m = me();
  let h = `<h2>${esc(q.q)}</h2>`;

      const cls = o === 0 ? "right" : by.length ? "wrong" : "";
      return `<div class="opt ${cls}"><span>${esc(opts[o])}</span><span class="dots">${by.map(p => `<i style="--c:${COL[p]}" title="${esc(S.seats[p].nm)}"></i>`).join("")}</span></div>`;
    }).join("")}</div>`;
    const none = ph.parts.filter(p => !ph.res[p] || ph.res[p].v === null);

function endHtml(S) {

    <div class="final">${o.map((p, i) => `<div class="row"><span>${i + 1}. ${chip(p, S)}</span><b style="color:${COL[p]}">${score(p, S)}</b></div>`).join("")}</div>`;

/* ================= input routing ================= */
function submit(seat, data) {
  if (authority()) {
    waiters.filter(w => !w.done && w.n === G.n && w.seat === seat).forEach(w => finish(w, data));
  } else if (MODE === "client" && R && V) {
    R.presence({ans: {n: V.n, id: V.id, v: data.v === undefined ? null : data.v, t: data.t || 0}}).catch(() => {});
  }
}
function finish(w, d) { if (!w.done) { w.done = true; w.res(d); } }
function waitFor(seat, ms = Infinity) {
  const gen = GEN;
  return new Promise(res => {
    const w = {n: G.n, seat, done: false, res: d => { if (gen === GEN) res(d); }};
    waiters.push(w);
    if (ms !== Infinity) setTimeout(() => finish(w, null), ms);
    if (MODE === "host" && typeof seat === "number" && G.seats[seat].kind === "remote") setTimeout(() => checkPeer(seat), 0);
  });
}
function checkPeer(seat) {
  if (!R || !G) return;
  const p = R.peers().find(x => x.peer === G.seats[seat].peer), a = p && p.presence && p.presence.ans;
  if (a && a.n === G.n && a.id === G.id) submit(seat, a);
}

/* ================= engine (runs on the device that hosts the game) ================= */
function show(ph) {
  G.n++; G.ph = ph;
  waiters = waiters.filter(w => !w.done && w.n === G.n);
  render(); publish();
}
function refresh() { render(); publish(); }
function publish() { if (MODE === "host" && R) R.presence({role: "host", nm: myName, st: G}).catch(e => console.warn("presence", e)); }
async function next(ph) {
  ph.btn = ph.btn || "Continue";
  if (MODE === "host" && ph.auto === undefined) ph.auto = 4500;
  if (MODE !== "host") delete ph.auto;
  show(ph);
  if (MODE === "host" && ph.auto) await Promise.race([pause(ph.auto), waitFor("go")]);
  else await waitFor("go");
}
let pools = {};
function nextQ(ty) { if (!pools[ty] || !pools[ty].length) pools[ty] = shuffle(BANK[ty].map((_, i) => i)); return pools[ty].pop(); }
function clean(ty, a) {
  if (!a || typeof a !== "object") return {v: null, t: DUR};
  let t = Number(a.t); t = Number.isFinite(t) ? Math.round(clamp(t, 0, DUR) * 10) / 10 : DUR;
  let v = a.v;
  if (ty === "m") v = Number.isInteger(v) && v >= 0 && v <= 3 ? v : null;
  else if (ty === "n") v = typeof v === "number" && Number.isFinite(v) && v >= 0 && v < 1e7 ? Math.round(v) : null;
  else v = typeof v === "string" && v.trim() ? stripCtl(v).slice(0, 30) || null : null;
  return {v, t};
}
function bell() { return (Math.random() + Math.random() + Math.random() - 1.5) * 1.4; }
function botAnswer(ty, qi, p) {
  const b = G.seats[p];
  const t = Math.round(clamp(2 + Math.random() * 9 / b.speed, 1.5, DUR - 1) * 10) / 10;
  const luck = clamp(b.skill + (Math.random() - 0.5) * 0.36, 0.12, 0.93);   // a good bot can still have a bad day
  if (ty === "m") return {v: Math.random() < luck ? 0 : 1 + rnd(3), t};
  if (ty === "w") {
    const q = WORD[qi];
    if (Math.random() < luck - 0.05) return {v: q.a[0], t};
    return {v: Math.random() < 0.3 ? null : pickOne(q.w), t: Math.min(DUR - 1, t + 3)};
  }
  const q = NUM[qi], r = Math.random();
  let g;
  if (r < 0.08) g = q.a + (Math.random() < 0.5 ? -1 : 1) * q.s * (2.5 + Math.random() * 3);   // wild guess
  else if (r < 0.08 + b.skill * 0.22) g = q.a;                                               // nails it
  else g = q.a + bell() * q.s * (1.9 - b.skill * 1.3);
  return {v: Math.max(0, Math.round(g)), t};
}
async function ask(ty, parts, eb) {
  const qi = nextQ(ty), ord = ty === "m" ? shuffle([0, 1, 2, 3]) : null;
  const base = {k: "q", eb, ty, qi, ord, parts};
  const humans = parts.filter(p => G.seats[p].kind !== "bot");
  const raw = {};
  if (MODE === "hot" && humans.length) {
    for (const p of humans) {
      show({k: "pass", eb, s: p});
      await waitFor(p);
      show({...base, ask: p, dur: DUR});
      raw[p] = await waitFor(p, (DUR + 3) * 1000);
    }
  } else if (humans.length) {
    show({...base, dur: DUR});
    const got = await Promise.all(humans.map(p => waitFor(p, (DUR + 4) * 1000)));
    humans.forEach((p, i) => raw[p] = got[i]);
  } else {
    show({...base, dur: 3});
    await pause(2900);
  }
  const q = BANK[ty][qi], res = {};
  for (const p of parts) {
    const a = raw[p] === undefined && G.seats[p].kind === "bot" ? botAnswer(ty, qi, p) : clean(ty, raw[p]);
    const r = {v: a.v, t: a.t};
    if (ty === "m") r.ok = a.v === 0;
    else if (ty === "n") { r.d = a.v === null ? null : Math.abs(a.v - q.a); r.ok = r.d === 0; }
    else r.ok = a.v !== null && matches(a.v, q.a);
    res[p] = r;
  }
  const rank = parts.slice().sort((a, b) => {
    const A = res[a], B = res[b];
    if (ty === "n") { const da = A.d === null ? 1e9 : A.d, db = B.d === null ? 1e9 : B.d; if (da !== db) return da - db; }
    else if (A.ok !== B.ok) return A.ok ? -1 : 1;
    if ((A.v === null) !== (B.v === null)) return A.v === null ? 1 : -1;
    return A.t - B.t;
  });

}
const reveal = (r, eb, out, good, btn, bad = []) => next({k: "rev", eb, ty: r.ty, qi: r.qi, ord: r.ord, parts: r.parts, res: r.res, rank: r.rank, out, good, bad, btn: btn || "Continue", auto: 5500});

async function humanPick(p, ids, eb, h, ptxt) {
  show({k: "pick", eb, who: p, ids, h, p: ptxt || ""});
  const r = await waitFor(p, G.seats[p].kind === "remote" ? 40000 : Infinity);
  return r && ids.includes(r.v) ? r.v : pickOne(ids);
}
function botBase() {
  const bases = G.ty.map((t, i) => t === "b" ? i : -1).filter(i => i >= 0);
  const c = free().map(i => ({i, s: (bases.length ? Math.min(...bases.map(b => dist(i, b))) : 3) + Math.random() * 2.2}));
  c.sort((a, b) => b.s - a.s);
  return pickOne(c.slice(0, 3)).i;
}
function botClaim(p) {
  const ids = freeFor(p);
  if (Math.random() < 0.25) return pickOne(ids);
  return ids.map(i => ({i, s: NB[i].filter(n => G.o[n] === p).length + Math.random() * 0.9})).sort((a, b) => b.s - a.s)[0].i;
}
function botTarget(p) {
  const ids = targetsFor(p); if (!ids.length) return null;
  if (Math.random() < 0.3) return pickOne(ids);
  const lead = Math.max(...[0, 1, 2].map(x => score(x, G)));
  const v = i => (G.ty[i] === "b" ? (G.tw[i] === 1 ? 6 : -1) : 1) + (score(G.o[i], G) === lead ? 0.6 : 0) + Math.random() * 1.2;
  return ids.sort((a, b) => v(b) - v(a))[0];
}

function newGame(mode, seats) {
  MODE = mode; GEN++;
  G = {id: Math.random().toString(36).slice(2, 8), n: 0, seats, o: Array(27).fill(-1), ty: Array(27).fill(""), tw: Array(27).fill(0),
       bonus: [0, 0, 0], alive: [true, true, true], turn: -1, hot: -1, ph: {k: "msg", h: ""}};
  waiters = []; pools = {}; t0 = {}; panelKey = ""; pickedKey = "";
  $("#leave").hidden = false;
  runGame().catch(e => { console.error(e); });
}
async function runGame() {
  const all = [0, 1, 2];
  let eb = "Stage 1 of 3 · Capitals";
  for (const p of all) {
    G.turn = p; let id;
    if (G.seats[p].kind === "bot") {
      show({k: "pick", eb, who: p, ids: [], h: `{${p}} {${p}:is|are} choosing a capital…`});
      await pause(900); id = botBase();
    } else {
      id = await humanPick(p, free(), eb, `{${p}}, tap any country to make it your capital.`, "A capital starts with three stars and is worth 1000 points. Fewer neighbours means fewer attacks.");
    }
    G.o[id] = p; G.ty[id] = "b"; G.tw[id] = 3; G.hot = id; refresh(); await pause(500); G.hot = -1;
  }
  G.turn = -1;
  await next({k: "msg", eb, h: "Capitals are set.", p: all.map(p => `{${p}} {${p}:holds|hold} ${NAME[capOf(p)]}`).join(". ") + ".", btn: "Start spreading out"});

  let round = 0; const total = Math.ceil(free().length / 4);
  while (free().length) {
    round++; eb = `Stage 2 of 3 · Spread out · Question ${round} of ${total}`;
    const ty = Math.random() < 0.55 ? "n" : "w";
    const r = await ask(ty, all, eb);
    const [a, b, c] = r.rank;
    const head = ty === "n" ? `{${a}} {${a}:was|were} closest` : r.res[a].ok ? `{${a}} {${a}:was|were} the fastest right answer` : `Nobody got it. {${a}} {${a}:was|were} quickest`;
    await reveal(r, eb, `${head} and {${a}:claims|claim} two countries. Then {${b}} and {${c}} claim one each.`, [a], "Claim countries");
    for (const p of [a, a, b, c]) {
      if (!free().length) break;
      G.turn = p;
      if (G.seats[p].kind === "bot") {
        const id = botClaim(p);
        show({k: "pick", eb, who: p, ids: [], h: `{${p}} {${p}:claims|claim} ${NAME[id]}.`});
        G.hot = id; refresh(); await pause(600);
        G.o[id] = p; G.ty[id] = "c"; G.hot = -1; refresh(); await pause(400);
      } else {
        const id = await humanPick(p, freeFor(p), eb, `{${p}}, tap a highlighted country to claim it.`, "");
        G.o[id] = p; G.ty[id] = "c"; refresh();
      }
    }
    G.turn = -1; refresh();
  }
  await next({k: "msg", eb: "Stage 3 of 3 · Battle", h: "The map is full. Time to fight.", p: `Everyone attacks ${BATTLE_ROUNDS} times. Dashed lines across the sea count as borders. If both players are right, a closest-guess question decides. A successful defence earns 100 points.`, btn: "To battle"});

  outer:
  for (let r = 1; r <= BATTLE_ROUNDS; r++) {
    for (let k = 0; k < 3; k++) {
      const p = (k + r - 1) % 3;
      if (!G.alive[p]) continue;
      if (G.alive.filter(Boolean).length < 2) break outer;
      eb = `Stage 3 of 3 · Battle · Round ${r} of ${BATTLE_ROUNDS}`;
      const targets = targetsFor(p); if (!targets.length) continue;
      G.turn = p;
      const id = G.seats[p].kind === "bot" ? botTarget(p)
        : await humanPick(p, targets, eb, `{${p}}, pick a neighbour to attack.`, "Capitals show their stars. Each star needs one more win in a row.");
      if (id === null) continue;
      await battle(p, id, eb);
      G.hot = -1; G.turn = -1; refresh();
    }
  }
  const order = [0, 1, 2].sort((a, b) => score(b, G) - score(a, G));
  G.turn = -1;
  await next({k: "end", eb: "Final result", order, btn: MODE === "hot" ? "Back to menu" : "Play again", auto: 0});
  if (MODE === "solo") startSolo();
  else if (MODE === "hot") goMenu();
  else if (MODE === "host") newGame("host", G.seats.map((s, i) => s.kind === "bot" ? makeBot(G.seats.map(x => x.nm)) : s));
}
async function battle(att, id, eb) {
  const name = NAME[id], def = G.o[id], cap = G.ty[id] === "b";
  G.hot = id;
  const head = `${eb} · ${name}`;
  await next({k: "msg", eb: head, h: `{${att}} {${att}:attacks|attack} ${name}, ${cap ? "the capital of" : "held by"} {${def}}.`,
    p: cap ? `${G.tw[id]} ${G.tw[id] === 1 ? "star" : "stars"} left on this capital.` : "", btn: "Fight", auto: 3000});
  for (;;) {
    const r = await ask(Math.random() < 0.65 ? "m" : "w", [att, def], head);
    let win, rr = r;
    if (r.res[att].ok && r.res[def].ok) {
      await reveal(r, head, "Both right. A closest guess decides.", [], "Tie-break");
      rr = await ask("n", [att, def], head + " · Tie-break");
      win = rr.rank[0] === att;
    } else win = r.res[att].ok;
    if (!win) {
      G.bonus[def] += 100;
      await reveal(rr, head, `{${def}} {${def}:holds|hold} ${name}. +100 for the defence.`, [def]);
      return;
    }
    if (cap) {
      G.tw[id]--;
      if (G.tw[id] > 0) { await reveal(rr, head, `A star falls from ${name}. ${G.tw[id]} left, and the attack goes on.`, [att], "Next question"); continue; }
      const n = count(def, G);
      G.o = G.o.map(o => o === def ? att : o); G.ty[id] = "f"; G.alive[def] = false;
      await reveal(rr, head, `${name} falls. {${att}} {${att}:takes|take} all ${n} of {${def}p} countries.`, [att]);
      return;
    }
    G.o[id] = att; G.ty[id] = "x";
    await reveal(rr, head, `{${att}} {${att}:takes|take} ${name}. It is now worth 400.`, [att]);
    return;
  }
}

  GEN++; G = null; V = null; waiters = []; MODE = "menu"; mySeat = -1;
  if (R) { try { R.leave().catch(() => {}); } catch (e) {} R = null; }
  roomCode = ""; $("#roomTag").textContent = ""; $("#leave").hidden = true;
  screen(`<div class="eyebrow">European Union trivia conquest</div><h1>Twelve <span>Stars</span></h1>
    <p class="dim">Three rivals, 27 member states, one map. Answer faster and closer than everyone else to take the Union.</p>
    <div class="stack">
      <button class="choice" id="m-solo"><b>Play against bots</b><span>You versus two bots with their own strengths and bad days.</span></button>
      <button class="choice" id="m-hot"><b>Pass and play</b><span>Two or three friends sharing one phone.</span></button>
      <button class="choice" id="m-online"><b>Online room</b><span>Friends on their own phones join with a code.</span></button>
    </div>${RULES}`);
  $("#m-solo").onclick = startSolo;
  $("#m-hot").onclick = hotSetup;
  $("#m-online").onclick = onlineSetup;
}
function startSolo() {
  const b1 = makeBot([]), b2 = makeBot([b1.nm]);
  newGame("solo", [{nm: "You", kind: "me"}, b1, b2]);
}
function hotSetup() {
  let n = 3;
  const draw = () => {
    screen(`<div class="eyebrow">Pass and play</div><h2>Who is playing?</h2>
      <div class="seg" role="group" aria-label="Number of players"><button id="n2" aria-pressed="${n === 2}">2 players + 1 bot</button><button id="n3" aria-pressed="${n === 3}">3 players</button></div>
      <div class="stack">${[0, 1, 2].slice(0, n).map(i => `<label class="f" for="hn${i}">Player ${i + 1}<input type="text" id="hn${i}" maxlength="14" autocomplete="off" placeholder="Name" value="${esc(hotNames[i] || "")}"></label>`).join("")}</div>
      <p class="dim small">Questions are answered one person at a time. The phone shows whose turn it is, so everyone else can look away.</p>
      <button class="go" id="hgo">Start game</button><button class="ghost" id="back">Back</button>`);
    $("#n2").onclick = () => { save(); n = 2; draw(); };
    $("#n3").onclick = () => { save(); n = 3; draw(); };
    $("#back").onclick = goMenu;
    $("#hgo").onclick = () => {
      save();
      const seats = [0, 1, 2].slice(0, n).map(i => ({nm: cleanName(hotNames[i]) || `Player ${i + 1}`, kind: "local"}));
      if (n === 2) seats.push(makeBot(seats.map(s => s.nm)));
      newGame("hot", seats);
    };
  };
  const save = () => [0, 1, 2].forEach(i => { const e = document.getElementById("hn" + i); if (e) hotNames[i] = e.value; });
  draw();
}
const hotNames = [];

/* ================= online rooms ================= */
const roomP = (async () => {
  try { const c = window.claude; if (!c || typeof c.use !== "function") return null; return await c.use("room"); }
  catch (e) { return null; }
})();
const NO_ROOM = `<div class="note"><b>Online rooms can't connect here.</b> Each player has to open this game while signed in to Claude, and the owner has to invite them to it. Pass and play works for everyone.</div>`;
async function onlineSetup() {
  screen(`<div class="eyebrow">Online room</div><h2>Checking the connection…</h2>`);
  const room = await roomP;
  if (MODE !== "menu") return;
  const ok = !!room;
  screen(`<div class="eyebrow">Online room</div><h2>Play with friends on their own phones</h2>
    ${ok ? "" : NO_ROOM}
    <label class="f" for="oname">Your name<input type="text" id="oname" maxlength="14" autocomplete="off" placeholder="Name" value="${esc(myName)}"></label>
    <button class="go" id="create" ${ok ? "" : "disabled"}>Create a room</button>
    <p class="dim small">Or join a friend's room:</p>
    <div class="row2"><input type="text" id="ocode" maxlength="4" autocomplete="off" autocapitalize="characters" placeholder="CODE" aria-label="Room code" style="text-transform:uppercase;letter-spacing:.2em;font-weight:800"><button class="ghost" id="join" ${ok ? "" : "disabled"}>Join</button></div>
    <p class="dim small" id="oerr"></p>
    <button class="ghost" id="back">Back</button>`);
  $("#back").onclick = goMenu;
  const nameOk = () => { myName = cleanName($("#oname").value); if (!myName) { $("#oerr").textContent = "Type your name first."; $("#oname").focus(); } return !!myName; };
  if (!ok) return;
  $("#create").onclick = () => { if (nameOk()) hostRoom(room); };
  $("#join").onclick = () => {
    if (!nameOk()) return;
    const code = $("#ocode").value.toUpperCase().replace(/[^A-Z]/g, "");
    if (code.length !== 4) { $("#oerr").textContent = "Room codes have four letters."; return; }
    joinRoom(room, code);
  };
}
async function hostRoom(room) {
  roomCode = Array.from({length: 4}, () => "ABCDEFGHJKLMNPQRSTUVWXYZ"[rnd(24)]).join("");
  try { R = await room.join("ts-" + roomCode.toLowerCase()); }
  catch (e) { $("#oerr").textContent = "Couldn't open a room right now. Try again in a moment."; return; }
  MODE = "host"; G = null; $("#leave").hidden = false; $("#roomTag").textContent = "ROOM " + roomCode;
  R.presence({role: "host", nm: myName, st: null}).catch(() => {});
  R.onPeers(ch => onHostPeers(ch), () => {});
  drawHostLobby();
}
const lobbyPlayers = () => R ? R.peers().filter(p => !p.sameTab && p.kind === "viewer" && p.presence && p.presence.role === "player") : [];
function drawHostLobby() {
  const ps = lobbyPlayers(), seated = ps.slice(0, 2), bots = 2 - seated.length;
  screen(`<div class="eyebrow">Online room · You are hosting</div><div class="codebig">${roomCode}</div>
    <p class="dim">Friends open this game, tap <b>Online room</b> and type the code. Up to two can join. Empty seats are filled with bots.</p>
    <ul class="lobby"><li>${esc(myName)}<span>host</span></li>${seated.map(p => `<li>${esc(cleanName(p.presence.nm) || "Friend")}<span>joined</span></li>`).join("")}${ps.slice(2).map(p => `<li>${esc(cleanName(p.presence.nm) || "Friend")}<span>watching</span></li>`).join("")}${Array.from({length: bots}, () => `<li class="dim">Waiting for a friend…<span>or a bot</span></li>`).join("")}</ul>
    <button class="go" id="start">Start with ${seated.length} ${seated.length === 1 ? "friend" : "friends"}${bots ? ` and ${bots} ${bots === 1 ? "bot" : "bots"}` : ""}</button>`);
  $("#start").onclick = () => {
    myPeer = (R.peers().find(p => p.sameTab) || {}).peer || null;
    const seats = [{nm: myName, kind: "host", peer: myPeer}, ...lobbyPlayers().slice(0, 2).map(p => ({nm: cleanName(p.presence.nm) || "Friend", kind: "remote", peer: p.peer}))];
    while (seats.length < 3) seats.push(makeBot(seats.map(s => s.nm)));
    newGame("host", seats);
  };
}
function onHostPeers(ch) {
  if (MODE !== "host") return;
  if (!G) { drawHostLobby(); return; }
  for (const p of [...ch.joined, ...ch.updated]) {
    const a = p.presence && p.presence.ans;
    if (!a || a.n !== G.n || a.id !== G.id) continue;
    const s = G.seats.findIndex(x => x.kind === "remote" && x.peer === p.peer);
    if (s >= 0) submit(s, a);
  }
  for (const p of ch.left) {
    const s = G.seats.findIndex(x => x.kind === "remote" && x.peer === p.peer);
    if (s < 0) continue;
    setTimeout(() => {   // a short drop is normal; only replace players who stay gone
      if (!G || !R || R.peers().some(x => x.peer === p.peer)) return;
      const bot = makeBot(G.seats.map(x => x.nm));
      Object.assign(G.seats[s], {kind: "bot", skill: bot.skill, speed: bot.speed, nm: G.seats[s].nm + " (bot)"});
      waiters.filter(w => w.seat === s).forEach(w => finish(w, null));
      refresh();
    }, 6000);
  }
}
async function joinRoom(room, code) {
  try { R = await room.join("ts-" + code.toLowerCase()); }
  catch (e) { $("#oerr").textContent = "Couldn't reach that room. Check the code and try again."; return; }
  MODE = "client"; V = null; seenHost = false; roomCode = code; mySeat = -1;
  $("#leave").hidden = false; $("#roomTag").textContent = "ROOM " + code;
  R.presence({role: "player", nm: myName}).catch(() => {});
  screen(`<div class="eyebrow">Online room ${code}</div><h2>Looking for the host…</h2>`);
  R.onPeers(ch => onClientPeers(ch), () => {});
  setTimeout(() => {
    if (MODE === "client" && !seenHost && R && R.name === "ts-" + code.toLowerCase())
      screen(`<div class="eyebrow">Online room ${code}</div><h2>No game with code ${code} yet.</h2><p class="dim">Check the code with your host. This screen joins as soon as their room opens.</p>`);
  }, 9000);
}
function onClientPeers(ch) {
  if (MODE !== "client") return;
  const mine = ch.peers.find(p => p.sameTab); if (mine) myPeer = mine.peer;
  const h = ch.peers.find(p => p.kind === "viewer" && !p.sameTab && p.presence && p.presence.role === "host");
  if (!h) {
    if (seenHost) { clearTimeout(hostGoneT); hostGoneT = setTimeout(() => {
      if (MODE === "client" && R && !R.peers().some(p => p.presence && p.presence.role === "host")) {
        V = null; screen(`<div class="eyebrow">Online room ${roomCode}</div><h2>The host left the game.</h2><button class="go" id="back">Back to menu</button>`); $("#back").onclick = goMenu;
      } }, 6000); }
    return;
  }
  seenHost = true; clearTimeout(hostGoneT);
  const st = h.presence.st;
  if (!st || typeof st !== "object" || !Array.isArray(st.seats) || st.seats.length !== 3 || !st.ph || !Array.isArray(st.o)) {
    V = null;
    const players = ch.peers.filter(p => p.presence && p.presence.role === "player");
    screen(`<div class="eyebrow">Online room ${roomCode}</div><h2>You're in ${esc(cleanName(h.presence.nm) || "the host")}'s room.</h2>
      <p class="dim">The game starts when the host taps Start.</p>
      <ul class="lobby"><li>${esc(cleanName(h.presence.nm) || "Host")}<span>host</span></li>${players.map(p => `<li>${p.sameTab ? "You" : esc(cleanName(p.presence.nm) || "Friend")}<span>joined</span></li>`).join("")}</ul>${RULES}`);
    return;
  }
  st.seats.forEach(s => { s.nm = cleanName(s.nm) || "Player"; });
  V = st; mySeat = V.seats.findIndex(s => s && s.peer && s.peer === myPeer);
  try { render(); } catch (e) { console.error(e); }
}

/* ================= start ================= */
let leaveArmed = null;
$("#leave").addEventListener("click", () => {
  const b = $("#leave");
  if (leaveArmed) { clearTimeout(leaveArmed); leaveArmed = null; b.textContent = "Menu"; goMenu(); return; }
  b.textContent = "Tap again to leave";
  leaveArmed = setTimeout(() => { leaveArmed = null; b.textContent = "Menu"; }, 3000);
});
buildMap();
goMenu();
</script>
</body>
</html>
